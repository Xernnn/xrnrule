name: CI

on:
  push:
  pull_request:

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The end-to-end test needs python3 + bcrypt and the sibling xrnloops repo; without them it
      # skips itself. Nothing here needs the Android SDK beyond what the runner ships.
      - run: pip install bcrypt
      - run: ./gradlew :domain:test :desktop:test :app:testSideloadDebugUnitTest :app:checkReleaseKeeps --console=plain

  server-and-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The sync server on the oldest and newest Python it may run on: how deep json.loads nests
      # changed in 3.14, which the home server runs. Each runs even when the other fails.
      - uses: actions/setup-python@v5
        id: py312
        with:
          python-version: "3.12"
      - uses: actions/setup-python@v5
        id: py314
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sync server tests, Python 3.12
        run: |
          py="${{ steps.py312.outputs.python-path }}"
          "$py" -m pip install --quiet bcrypt
          "$py" -m unittest server/test_xrnrule_sync.py
      - name: Sync server tests, Python 3.14
        if: ${{ !cancelled() }}
        run: |
          py="${{ steps.py314.outputs.python-path }}"
          "$py" -m pip install --quiet bcrypt
          "$py" -m unittest server/test_xrnrule_sync.py
      - run: for f in extension/*.js; do node --check "$f"; done
      - run: node --test extension/test/*.test.mjs
      - run: node --test server/*.test.mjs
